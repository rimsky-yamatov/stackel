[package]
name = "stackel"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Stackel: a pure, stack-oriented functional language with effect types"
readme = "README.md"
# Only what a release or `cargo install` needs.
exclude = [".github/", "scripts/"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
