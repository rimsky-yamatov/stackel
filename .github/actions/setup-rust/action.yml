name: Set up Rust
description: >
  Installs a Rust toolchain with rustup, which every GitHub-hosted runner image ships
  (Linux, macOS, Windows, x64 and arm64), and makes it the default.
inputs:
  toolchain:
    description: Toolchain to install, e.g. stable or 1.75.0.
    default: stable
  components:
    description: Space-separated extra components, e.g. "rustfmt clippy".
    default: ""
  targets:
    description: Space-separated extra compilation targets.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        args=(--profile minimal)
        for c in $COMPONENTS; do args+=(--component "$c"); done
        for t in $TARGETS; do args+=(--target "$t"); done
        rustup toolchain install "$TOOLCHAIN" "${args[@]}" --no-self-update
        rustup default "$TOOLCHAIN"
        rustc -vV
        cargo -V
