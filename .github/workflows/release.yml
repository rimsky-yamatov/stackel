name: Release

# Pushing a tag such as v0.2.0 builds every platform, checks each binary against the examples,
# and publishes a GitHub release with the archives, SHA256SUMS and the release notes.
# Running the workflow by hand is a rehearsal: it builds and uploads the archives as workflow
# artifacts but publishes nothing.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

# An explicit shell makes GitHub run `bash -eo pipefail`, so a failing script in a pipeline fails
# the step. It is also the shell the helper scripts need on the Windows runners.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # See ci.yml: the latest `cross` release predates several of the targets.
  CROSS_REV: a9301e91f72bba3850460512685f6b16062015ff

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      publish: ${{ steps.info.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes need the tags and the history between them.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
      - name: Check the tag against Cargo.toml
        id: info
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            publish=true
          else
            version="$(sed -n 's/^version *= *"\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
            tag="v$version"
            publish=false
          fi
          scripts/check-release-version.sh "$tag" | tee -a "$GITHUB_OUTPUT"
          {
            echo "tag=$tag"
            echo "publish=$publish"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Check that Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Test the helper scripts
        run: scripts/test-release-notes.sh
      - name: Write the release notes
        env:
          TAG: ${{ steps.info.outputs.tag }}
          PUBLISH: ${{ steps.info.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then ref="$TAG"; else ref=HEAD; fi
          scripts/release-notes.sh "$ref" > release-notes.md
          echo >> release-notes.md
          cat .github/release-footer.md >> release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # Platforms with a GitHub-hosted runner: the binary is built, then run against every example.
  build-native:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          # Built on the x64 runner; Windows runs 32-bit programs, so it is checked there too.
          - { os: windows-latest, target: i686-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXE: target/${{ matrix.target }}/release/stackel${{ contains(matrix.target, 'windows') && '.exe' || '' }}
        run: |
          test "$("$EXE" --version)" = "stackel $VERSION"
          STACKEL_CMD="$EXE" scripts/check-examples.sh
      - name: Package
        run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Everything else is built with `cross` and run under QEMU against the examples.
  build-cross:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, experimental: false }
          - { target: aarch64-unknown-linux-musl, experimental: false }
          - { target: armv7-unknown-linux-musleabihf, experimental: false }
          - { target: i686-unknown-linux-musl, experimental: false }
          - { target: riscv64gc-unknown-linux-gnu, experimental: false }
          - { target: powerpc64le-unknown-linux-gnu, experimental: false }
          - { target: s390x-unknown-linux-gnu, experimental: false }
          - { target: loongarch64-unknown-linux-gnu, experimental: true }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev "$CROSS_REV"
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Check the binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          STACKEL_CMD: cross run --release --locked --quiet --target ${{ matrix.target }} --
        run: |
          test "$($STACKEL_CMD --version)" = "stackel $VERSION"
          scripts/check-examples.sh
      - name: Package
        run: scripts/package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [prepare, build-native, build-cross]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - name: Write SHA256SUMS
        run: |
          cd dist
          ls -l
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          rm ./*.sha256
      - name: Create or update the release
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A re-run: replace the assets and the notes of the existing release.
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Stackel $VERSION" \
              --notes-file release-notes.md "${flags[@]}"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Stackel $VERSION" --notes-file release-notes.md "${flags[@]}" dist/*
          fi
