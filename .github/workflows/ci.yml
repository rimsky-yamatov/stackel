name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # `cross` is built from this commit of its main branch: the latest release (0.2.5) predates
  # several of the targets used below.
  CROSS_REV: a9301e91f72bba3850460512685f6b16062015ff

jobs:
  # Formatting and lints run on the oldest supported toolchain, so their results do not change
  # when a new stable Rust adds lints.
  lint:
    name: Lint (rustfmt, clippy, shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.75.0
          components: rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: shellcheck scripts/*.sh

  # The tests on every operating system and CPU architecture that has a GitHub-hosted runner.
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - name: Smoke test
        run: cargo run --locked --quiet -- --version

  # The oldest Rust that the crate declares in `rust-version`.
  msrv:
    name: Test (Rust 1.75, MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.75.0
      - run: cargo test --locked

  # Other CPU architectures, run under QEMU by `cross`. The test binary runs inside the
  # emulator and cannot start the stackel binary, so the tests that spawn it are skipped
  # (STACKEL_NO_SPAWN) and the examples are checked by scripts/check-examples.sh instead.
  cross-test:
    name: Test (${{ matrix.target }}, emulated)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: i686-unknown-linux-musl, experimental: false }
          - { target: aarch64-unknown-linux-musl, experimental: false }
          - { target: armv7-unknown-linux-musleabihf, experimental: false }
          - { target: riscv64gc-unknown-linux-gnu, experimental: false }
          - { target: powerpc64le-unknown-linux-gnu, experimental: false }
          # Big-endian: catches code that assumes the byte order.
          - { target: s390x-unknown-linux-gnu, experimental: false }
          - { target: loongarch64-unknown-linux-gnu, experimental: true }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev "$CROSS_REV"
      - run: cross build --locked --release --target ${{ matrix.target }}
      - name: Unit and integration tests
        env:
          STACKEL_NO_SPAWN: "1"
        run: cross test --locked --target ${{ matrix.target }}
      - name: Examples
        env:
          STACKEL_CMD: cross run --locked --release --quiet --target ${{ matrix.target }} --
        run: scripts/check-examples.sh

  # Operating systems that cannot run here, or that only have an emulator for build checks:
  # the crate must at least keep compiling for them.
  cross-build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-freebsd
          - aarch64-unknown-freebsd
          - x86_64-unknown-netbsd
          - x86_64-unknown-illumos
          - i686-pc-windows-gnu
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Install cross
        run: cargo install cross --locked --git https://github.com/cross-rs/cross --rev "$CROSS_REV"
      - run: cross build --locked --release --target ${{ matrix.target }}

  # One required check for branch protection.
  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, msrv, cross-test, cross-build]
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "a job did not succeed: $r"
              exit 1
            fi
          done
